<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOS World Dashboard</title>
    <meta property="og:title" content="SOS World Dashboard" />
    <meta property="og:description" content="Browse and discover VRChat worlds — filter by tags, platforms, capacity, and more." />
    <meta property="og:image" content="https://sos-world-dashboard.vercel.app/og-image.png" />
    <meta property="og:url" content="https://sos-world-dashboard.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SOS World Dashboard" />
    <meta name="twitter:description" content="Browse and discover VRChat worlds — filter by tags, platforms, capacity, and more." />
    <meta name="twitter:image" content="https://sos-world-dashboard.vercel.app/og-image.png" />
    <style>html { background-color: #0f172a; }</style>
    <script>
      (function() {
        try {
          const saved = localStorage.getItem('sos-theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
